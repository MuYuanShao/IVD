# ===========================================================================
# IVD Nginx 配置 — 前端静态 + 反向代理
# 对应 PRD 9.6 拓扑：统一入口，预留 TLS/国密证书
# 挂载到 /etc/nginx/conf.d/default.conf
# ===========================================================================

# 上游应用
upstream ivd_app_backend {
    server ivd-app:8080;
    # 二期多实例时改为：
    # server ivd-app-2:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS 跳转（启用 TLS 时生效；纯内网无证书可注释掉此段）
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # 健康检查（容器编排探测用）
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # 启用 HTTPS 时，80 端口仅做跳转：
    # return 301 https://$host$request_uri;

    # 未启用 HTTPS 时，80 端口直接服务：
    location / {
        proxy_pass http://ivd_app_backend;
    }
    include /etc/nginx/conf.d/proxy-common.conf;
}

