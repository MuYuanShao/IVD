# ===========================================================================
# IVD Nginx 公共片段 — 被 nginx.conf include
# ===========================================================================

# ---- 前端静态资源（Vue 构建产物，挂载在 ./nginx/html）----
location /static/ {
    alias /usr/share/nginx/html/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
}

location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
}

# ---- 后端 API 代理 ----
location /api/ {
    proxy_pass http://ivd_app_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 审核接口同步等待（PRD 8.2 接口 A），超时设宽避免出报告卡顿
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # 大文件上传（证照/验证报告 PDF）
    client_max_body_size 100m;
}

# ---- 健康检查/Actuator（仅内网，可加 IP 白名单）----
location /actuator/ {
    proxy_pass http://ivd_app_backend;
    # allow 10.0.0.0/8;     # 按医院内网网段配置
    # allow 172.16.0.0/12;
    # deny  all;
}

# ---- WebSocket / SSE 预留（二期实时推送：危急值、质控预警）----
location /ws/ {
    proxy_pass http://ivd_app_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}
