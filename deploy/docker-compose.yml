# ===========================================================================
# IVD 智慧实验室管理系统 — 一期部署编排
# 对应 PRD：第 9.6 节部署拓扑
# 组件：MySQL8 + Redis7 + MinIO + XXL-Job(admin) + ivd-app + Nginx
# 用法：
#   1. 复制 .env.example -> .env 并按医院实际修改密码/端口
#   2. docker compose up -d
#   3. 首次启动后执行 init/sql/ 下的建库脚本（或 Flyway 自动迁移）
# ===========================================================================

name: ivd

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0 — 主数据库（信创可平替达梦/OceanBase）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ivd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ivd}
      MYSQL_USER: ${MYSQL_USER:-ivd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Ivd@123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --innodb-buffer-pool-size=2G
      - --slow-query-log=ON
      - --long-query-time=2
      - --binlog-expire-logs-seconds=604800
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/sql:/docker-entrypoint-initdb.d:ro    # 首次启动自动建库/建表
      - ./init/mysql/my.cnf:/etc/mysql/conf.d/zz-ivd.cnf:ro
      - mysql_log:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [ivd-net]

  # ---------------------------------------------------------------------------
  # Redis 7 — 批次关联缓存 / 轻量队列 / Pub-Sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ivd-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:-Redis@123456}
      - --maxmemory 1gb
      - --maxmemory-policy allkeys-lru
      - --appendonly yes
      - --save 900 1
      - --save 300 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Redis@123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ivd-net]

  # ---------------------------------------------------------------------------
  # MinIO — 证照 / 验证报告 PDF 对象存储
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ivd-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ivdadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Minio@123456}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [ivd-net]

  # MinIO 启动后自动创建 bucket（ivd-cert / ivd-report）
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: ivd-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-ivdadmin} ${MINIO_ROOT_PASSWORD:-Minio@123456};
      mc mb -p local/ivd-cert      || true;
      mc mb -p local/ivd-report    || true;
      mc anonymous set download    local/ivd-report || true;
      echo 'MinIO buckets ready.';
      exit 0;
      "
    networks: [ivd-net]

  # ---------------------------------------------------------------------------
  # XXL-Job Admin — 定时任务调度中心（日清月结 / FEFO 重算 / 证照预警）
  # ---------------------------------------------------------------------------
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: ivd-xxl-job-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?Unicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${MYSQL_USER:-ivd}
        --spring.datasource.password=${MYSQL_PASSWORD:-Ivd@123456}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-xxl-job-token-ivd}
    ports:
      - "${XXL_JOB_PORT:-8081}:8080"
    volumes:
      - xxl_log:/data/applogs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/xxl-job-admin/toLogin"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [ivd-net]

  # ---------------------------------------------------------------------------
  # ivd-app — 主应用（Spring Boot 3, Java 17）
  # 默认 jar 内嵌 Tomcat 部署（信创要求时通过 profile 切 war+TongWeb）
  # ---------------------------------------------------------------------------
  ivd-app:
    image: ${IVD_APP_IMAGE:-ivd/ivd-app:1.0.0-mvp}
    container_name: ivd-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # ---- 数据库 ----
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ivd}?Unicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ivd}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-Ivd@123456}
      # ---- Redis ----
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-Redis@123456}
      # ---- MinIO ----
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ivdadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-Minio@123456}
      MINIO_BUCKET_CERT: ivd-cert
      MINIO_BUCKET_REPORT: ivd-report
      # ---- XXL-Job ----
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:-xxl-job-token-ivd}
      # ---- 审核兜底开关（PRD 8.6：服务异常默认放行）----
      IVD_AUDIT_FALLBACK_RELEASE: "true"
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC -Duser.timezone=Asia/Shanghai"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app_log:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [ivd-net]

  # ---------------------------------------------------------------------------
  # Nginx — 前端静态资源 + 反向代理（统一入口，可挂国密/TLS 证书）
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.26-alpine
    container_name: ivd-nginx
    restart: unless-stopped
    depends_on:
      ivd-app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro          # 前端构建产物
      - ./nginx/certs:/etc/nginx/certs:ro              # TLS/国密证书（预留）
      - nginx_log:/var/log/nginx
    networks: [ivd-net]

# =============================================================================
# 网络 & 数据卷
# =============================================================================
networks:
  ivd-net:
    driver: bridge

volumes:
  mysql_data:
  mysql_log:
  redis_data:
  minio_data:
  xxl_log:
  app_log:
  nginx_log:
